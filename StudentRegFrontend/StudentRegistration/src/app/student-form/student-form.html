<div>
    <h2>Student Registration Form - 1 </h2>

    <h3>{{Student.id?'Edit':'Add'}} Student</h3>

    <form (ngSubmit)="onSubmit()" #studentForm="ngForm">


        <input type="text" name="name" [(ngModel)]="Student.name" placeholder="Name" required /> <br><br>
        <input type="text" name="email" [(ngModel)]="Student.email" placeholder="E-mail" required /><br><br>
        <input type="text" name="course" [(ngModel)]="Student.course" placeholder="Courses eg. Java, Angular"
            required /><br><br>

        <button type="button" *ngIf="Student.id" (click)="resetForm()">Cancel</button><br><br>

        <button type="submit" [disabled]="!studentForm.valid">Save</button><br><br>


    </form>


</div>
