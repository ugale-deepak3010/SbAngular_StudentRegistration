<div>
    <h2 style="color: red; padding: 10px; background-color: yellow;">TABLE RELOADED!</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let student of students">
                <td>{{student.id}}</td>
                <td>{{student.name}}</td>
                <td>{{student.email}}</td>
                <td>{{student.course}}</td>
                <td>
                    <button (click)="editStudent(student)">Edit</button>
                    <button (click)="deleteStudent(student.id!)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>

</div>
